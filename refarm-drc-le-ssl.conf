<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName web-drc.product-act.com
	ServerAlias web-drc.product-act.com
	#Protocols h2 http/1.1

	ServerAdmin ariefslack@gmail.com
	DocumentRoot /apps/web-drc
	<Directory /apps/web-drc/>
           Options +Indexes +FollowSymLinks +MultiViews
           AllowOverride All
           Require all granted
           Allow from all
        </Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/web-drc.product-act.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/web-drc.product-act.com/privkey.pem
</VirtualHost>
</IfModule>
