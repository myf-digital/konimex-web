name: Deploy Himalaya Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SSH_HOST: ${{ secrets.VM_HOST }}
  SSH_USERNAME: ${{ secrets.VM_USER }}
  VM_PORT: ${{ secrets.VM_PORT || '22' }}
  SSH_PRIVATE_KEY: ${{ secrets.VM_KEY }}
  OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved netcat-openbsd

      - name: Create VPN config file
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          printf '%s\n' "$OVPN_CONFIG" > /tmp/client.ovpn

          # GitHub runner has no IPv6, strip IPv6 remote so we connect via IPv4 immediately
          sed -i '/^remote .* udp6$/d' /tmp/client.ovpn
          sed -i 's/^remote-random$/#remote-random (disabled: use IPv4 remote)/' /tmp/client.ovpn

          # VM is a public IP whitelisted to only accept connections from the VPN IP,
          # so force traffic to the VM through the VPN tunnel (source IP = VPN IP).
          if [ -n "$VM_HOST" ] && ! grep -qE "^route[[:space:]]+${VM_HOST}\b" /tmp/client.ovpn; then
            echo "route $VM_HOST 255.255.255.255" >> /tmp/client.ovpn
            echo "Forcing VM_HOST ($VM_HOST) to route through VPN tunnel."
          fi

          # Full-tunnel: route all traffic through the VPN so outbound packets are
          # NAT'd by the VPN server to its whitelisted egress IP (same behavior as the
          # working act-dap-v2 workflow).
          if ! grep -qE '^redirect-gateway' /tmp/client.ovpn; then
            echo "redirect-gateway def1 bypass-dhcp" >> /tmp/client.ovpn
            echo "Enabled redirect-gateway (full tunnel through VPN)."
          fi

      - name: Connect to VPN
        uses: "kota65535/github-openvpn-connect-action@v2"
        with:
          config_file: /tmp/client.ovpn

      - name: Verify VPN connectivity to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
        run: |
          set -euo pipefail

          echo "=== Tunnel interface ==="
          ip -br addr show | grep -E 'tun[0-9]|tap[0-9]' || echo "(no tun/tap interface found)"

          echo "=== Route to VM (should say dev tun0) ==="
          ip route get "$VM_HOST" || true

          echo "=== Public egress IP via VPN tunnel ==="
          curl -s --max-time 10 https://api.ipify.org || echo "(no internet through tunnel)"
          echo

          echo "=== TCP reachability to $VM_HOST:$VM_PORT (nc, 15 tries) ==="
          for i in $(seq 1 15); do
            if nc -zv -w 3 "$VM_HOST" "$VM_PORT" 2>&1; then
              echo "OK: $VM_HOST:$VM_PORT reachable through VPN."
              exit 0
            fi
            echo "not reachable yet (attempt $i/15)"
            sleep 2
          done

          echo "VM is NOT reachable through VPN. Check the route output above."
          exit 1

      - name: Transfer files to target server
        run: |
          ssh-keyscan -H -p "$VM_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts || true
          tar --exclude='.git' --exclude='.github' -czf - . \
            | ssh -o StrictHostKeyChecking=no -p "$VM_PORT" "$SSH_USERNAME@$SSH_HOST" \
              "rm -rf /tmp/himalaya-web-artifact && mkdir -p /tmp/himalaya-web-artifact && tar -xzf - -C /tmp/himalaya-web-artifact"

      - name: Setup application on target server
        run: |
          ssh -o StrictHostKeyChecking=no -p "$VM_PORT" "$SSH_USERNAME@$SSH_HOST" bash -s << 'REMOTE'
            set -euo pipefail

            echo "=== Starting Deployment for Himalaya Web ==="

            # 1. Ensure application directory exists
            cd /apps
            if [ ! -d "himalaya-web" ]; then
              echo "Directory /apps/himalaya-web does not exist. Creating..."
              sudo mkdir -p himalaya-web
              sudo chown www-data:www-data himalaya-web
              sudo chmod 755 himalaya-web
            fi

            # 2. Deploy artifact to application directory
            echo "Copying artifact to /apps/himalaya-web..."
            sudo rsync -av --delete --exclude='writable/' --exclude='application/cache/' /tmp/himalaya-web-artifact/ himalaya-web/

            # 3. Clean up temporary artifact
            rm -rf /tmp/himalaya-web-artifact

            # 4. Set appropriate permissions for PHP/Web Server
            echo "Setting permissions (www-data)..."
            sudo chown -R www-data:www-data himalaya-web
            sudo find himalaya-web -type d -exec chmod 755 {} \;
            sudo find himalaya-web -type f -exec chmod 644 {} \;

            # Optional: Jika codeigniter 4, pastikan folder writable ada dan writeable
            if [ -d "himalaya-web/writable" ]; then
               sudo chmod -R 777 himalaya-web/writable
            fi

            # Optional: Jika codeigniter 3, folder cache dsb writeable
            if [ -d "himalaya-web/application/cache" ]; then
               sudo chmod -R 777 himalaya-web/application/cache
            fi

            echo "=== Deployment Completed Successfully ==="
          REMOTE
