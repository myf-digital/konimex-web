<VirtualHost *:80>
	ServerName web-drc.product-act.com
	ServerAlias web-drc.product-act.com
	#Protocols h2 http/1.1

	ServerAdmin ariefslack@gmail.com
	DocumentRoot /apps/web-drc
	<Directory /apps/web-drc/>
           Options +Indexes +FollowSymLinks +MultiViews
           AllowOverride All
           Require all granted
           Allow from all
        </Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =web-drc.product-act.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
